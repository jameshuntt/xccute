[package]
name = "xccute"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Typed shell commands for Rust: builders for the commands people run, argv commands that are validated and previewed before they execute, chains, scripts and signed snapshots, one facade over xccute_contract, xccute_runtime, xccute_commands and xccute_decisions."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/xccute"
readme = "README.md"
keywords = ["cli", "shell", "command", "builder", "process"]
categories = ["command-line-interface", "os"]
include = ["src/**", "tests/**", "script_configs/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ed25519-dalek = "2"
xccute_contract = { version = "0.1.0", path = "../xccute_contract" }
xccute_runtime = { version = "0.1.1", path = "../xccute_runtime" }
xccute_commands = { version = "0.1.0", path = "../xccute_commands" }
xccute_decisions = { version = "0.2.0", path = "../xccute_decisions" }

[dev-dependencies]
simple_impl_derive = { version = "0.2.2", path = "../simple_impl_derive" }
